name: frontend
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  retrofit: ^4.7.2
  flutter_secure_storage: ^9.2.2

  json_annotation: ^4.8.0
  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1

  dio: ^5.10.0

  pretty_dio_logger: ^1.4.0

  freezed_annotation: ^3.1.0

  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3

  retrofit_generator: ^10.0.2

  json_serializable: ^6.6.1

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15

  freezed: ^3.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/role_selection/
    - assets/dashboard/
    - assets/child_login/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#9368EE"