services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile

    container_name: asalah-backend

    ports:
      - "5000:5000"

    env_file:
      - ./BackEnd/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile

    container_name: asalah-frontend

    ports:
      - "8080:80"

    restart: unless-stopped